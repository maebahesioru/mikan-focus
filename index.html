<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5a623">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍊</text></svg>">
<title>みかんフォーカス - Mikan Focus</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #fff8e7; --card: #fffdf6; --ink: #4a3800; --accent: #f5a623;
    --accent2: #e8890c; --leaf: #6a9e3f; --dim: #b8a86a;
  }
  body {
    font-family: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    background: linear-gradient(170deg, #fff8e7 0%, #ffedc2 100%);
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; color: var(--ink); padding: 20px;
  }
  .app { width: 100%; max-width: 560px; }
  header { text-align: center; margin: 12px 0 18px; }
  h1 { font-size: 1.9rem; letter-spacing: 2px; }
  .tagline { color: var(--dim); font-size: 0.9rem; margin-top: 4px; }
  .card {
    background: var(--card); border-radius: 20px; padding: 26px 24px;
    box-shadow: 0 4px 24px rgba(180, 140, 40, 0.12); margin-bottom: 16px;
  }
  .timer-wrap { text-align: center; }
  .mode-label {
    display: inline-block; font-size: 0.85rem; font-weight: 700;
    padding: 5px 16px; border-radius: 999px; margin-bottom: 10px;
    background: #ffe9b8; color: #8a6d1a; letter-spacing: 1px;
  }
  .mode-label.break { background: #d9ecc6; color: #4a7a2a; }
  .mode-label.long { background: #d6e4f0; color: #2a5a8a; }
  .dots { display: flex; gap: 8px; justify-content: center; margin: 6px 0 12px; }
  .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: #f2e6c8; border: 2px solid #e2d2a2;
    transition: background 0.3s, border-color 0.3s, transform 0.3s;
  }
  .dot.filled { background: var(--accent); border-color: var(--accent2); transform: scale(1.15); }
  .dot.long { background: #7aa8d0; border-color: #2a5a8a; }
  .time-display {
    font-size: 4.6rem; font-weight: 800; letter-spacing: 3px;
    font-variant-numeric: tabular-nums; line-height: 1.1;
    color: var(--ink); margin: 6px 0 4px;
  }
  .time-display.break { color: #4a7a2a; }
  .time-display.long { color: #2a5a8a; }
  .progress-track {
    height: 10px; border-radius: 999px; background: #f2e6c8;
    overflow: hidden; margin: 14px auto 20px; max-width: 420px;
  }
  .progress-fill {
    height: 100%; width: 0%; border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.5s linear;
  }
  .progress-fill.break { background: linear-gradient(90deg, #9ec97a, #6a9e3f); }
  .progress-fill.long { background: linear-gradient(90deg, #7aa8d0, #2a5a8a); }
  .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  button {
    font-family: inherit; font-size: 1.05rem; font-weight: 700;
    padding: 13px 34px; border: none; border-radius: 999px; cursor: pointer;
    transition: transform 0.1s, box-shadow 0.15s;
  }
  button:active { transform: scale(0.97); }
  .btn-main {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; box-shadow: 0 4px 14px rgba(232, 137, 12, 0.35);
  }
  .btn-main:hover { box-shadow: 0 6px 20px rgba(232, 137, 12, 0.45); }
  .btn-sub { background: #f2e6c8; color: #8a6d1a; }
  .btn-sub:hover { background: #ecdcb2; }
  .hint { font-size: 0.75rem; color: var(--dim); margin-top: 14px; }
  .tree-card { text-align: center; }
  .tree-title { font-size: 0.95rem; font-weight: 700; color: #8a6d1a; margin-bottom: 6px; }
  #treeCanvas { display: block; margin: 0 auto; image-rendering: pixelated; }
  .tree-stage { font-size: 0.85rem; color: var(--dim); margin-top: 6px; }
  .stats { display: flex; gap: 12px; }
  .stat {
    flex: 1; text-align: center; background: var(--card); border-radius: 16px;
    padding: 16px 8px; box-shadow: 0 3px 16px rgba(180, 140, 40, 0.10);
  }
  .stat .num { font-size: 1.6rem; font-weight: 800; color: var(--accent2); }
  .stat .lbl { font-size: 0.78rem; color: var(--dim); margin-top: 4px; }
  .settings { font-size: 0.9rem; }
  .settings summary { cursor: pointer; color: var(--dim); font-weight: 700; }
  .settings-grid { display: flex; gap: 14px; margin-top: 12px; flex-wrap: wrap; }
  .settings-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 0.82rem; color: #8a6d1a; }
  .settings-grid input {
    width: 90px; padding: 8px 10px; border: 2px solid #f2e6c8; border-radius: 10px;
    font-family: inherit; font-size: 1rem; color: var(--ink); background: #fff;
  }
  .settings-toggles { display: flex; gap: 18px; margin-top: 16px; flex-wrap: wrap; }
  .settings-toggles label {
    display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #8a6d1a; cursor: pointer;
  }
  .settings-toggles input { width: 16px; height: 16px; accent-color: var(--accent2); cursor: pointer; }
  footer { text-align: center; color: var(--dim); font-size: 0.8rem; margin: 10px 0 20px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🍊 みかんフォーカス</h1>
    <div class="tagline">Mikan Focus — 集中するたび、みかんの木が育つ。</div>
  </header>

  <div class="card timer-wrap">
    <div class="mode-label" id="modeLabel">🍊 集中タイム</div>
    <div class="dots" id="cycleDots" title="ロング休憩までのみかん"></div>
    <div class="time-display" id="timeDisplay">25:00</div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="btn-row">
      <button class="btn-main" id="startBtn">スタート</button>
      <button class="btn-sub" id="resetBtn">リセット</button>
      <button class="btn-sub" id="skipBtn">スキップ</button>
    </div>
    <div class="hint">⌨️ スペース = 開始/一時停止　R = リセット　S = スキップ</div>
  </div>

  <div class="card tree-card">
    <div class="tree-title">🌳 あなたのみかんの木</div>
    <canvas id="treeCanvas" width="320" height="180"></canvas>
    <div class="tree-stage" id="treeStage">まだ種をまいたばかり…</div>
  </div>

  <div class="stats">
    <div class="stat"><div class="num" id="statToday">0</div><div class="lbl">今日のみかん</div></div>
    <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">これまでのみかん</div></div>
    <div class="stat"><div class="num" id="statMinutes">0</div><div class="lbl">集中した分（分）</div></div>
  </div>

  <div class="card settings">
    <details>
      <summary>⚙️ 設定</summary>
      <div class="settings-grid">
        <label>集中（分）<input type="number" id="workMin" min="1" max="120" value="25"></label>
        <label>休憩（分）<input type="number" id="breakMin" min="1" max="60" value="5"></label>
        <label>ロング休憩（分）<input type="number" id="longBreakMin" min="1" max="90" value="15"></label>
        <label>何回でロング休憩<input type="number" id="cyclesPerLong" min="2" max="8" value="4"></label>
      </div>
      <div class="settings-toggles">
        <label><input type="checkbox" id="soundOn" checked> 通知音</label>
        <label><input type="checkbox" id="notifyOn" checked> デスクトップ通知</label>
        <label><input type="checkbox" id="autoStartNext"> 次のフェーズを自動開始</label>
      </div>
    </details>
  </div>

  <footer>みかんフォーカス v1.1 — Embassy プロジェクト / データはブラウザに保存されます</footer>
</div>

<script>
// ===== 保存データ (v2) =====
const STORE_KEY = 'mikan-focus';
const BASE_TITLE = 'みかんフォーカス - Mikan Focus';
const DEFAULT_SETTINGS = {
  workMin: 25, breakMin: 5, longBreakMin: 15, cyclesPerLong: 4,
  soundOn: true, notifyOn: true, autoStartNext: false,
};

function dayKey(dt = new Date()) {
  const y = dt.getFullYear();
  const m = String(dt.getMonth() + 1).padStart(2, '0');
  const d = String(dt.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function loadData() {
  let raw = {};
  try { raw = JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch {}
  const d = {
    v: 2,
    settings: Object.assign({}, DEFAULT_SETTINGS, raw.settings || {}),
    stats: raw.stats || { sessionsTotal: 0, minutesTotal: 0, days: {} },
    cycleCount: raw.cycleCount || 0,
    growth: raw.growth || 0,
    tasks: raw.tasks || [],
    activeTaskId: raw.activeTaskId || null,
  };
  if (!raw.v) {
    // v1 → v2 移行
    if (raw.sessionsTotal) d.stats.sessionsTotal = raw.sessionsTotal;
    if (raw.minutesTotal) d.stats.minutesTotal = raw.minutesTotal;
    if (raw.growth) d.growth = raw.growth;
    if (raw.lastDate === new Date().toDateString() && raw.sessionsToday) {
      const key = dayKey();
      d.stats.days[key] = d.stats.days[key] || { sessions: 0, minutes: 0 };
      d.stats.days[key].sessions += raw.sessionsToday;
    }
  }
  if (!d.stats.days) d.stats.days = {};
  return d;
}

let data = loadData();
function saveData() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch {}
}

// ===== タイマー状態 =====
const state = {
  mode: 'work',       // 'work' | 'break' | 'long'
  running: false,
  remain: 0,
  totalSec: 0,
  timer: null,
  lastTick: 0,
};

function phaseSec(mode) {
  const s = data.settings;
  if (mode === 'work') return Math.max(1, s.workMin) * 60;
  if (mode === 'long') return Math.max(1, s.longBreakMin) * 60;
  return Math.max(1, s.breakMin) * 60;
}

function setMode(mode) {
  state.mode = mode;
  state.totalSec = phaseSec(mode);
  state.remain = state.totalSec;
}

// ===== UI参照 =====
const timeDisplay = document.getElementById('timeDisplay');
const modeLabel = document.getElementById('modeLabel');
const progressFill = document.getElementById('progressFill');
const startBtn = document.getElementById('startBtn');
const resetBtn = document.getElementById('resetBtn');
const skipBtn = document.getElementById('skipBtn');
const cycleDots = document.getElementById('cycleDots');

function fmt(sec) {
  const m = Math.floor(sec / 60).toString().padStart(2, '0');
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return m + ':' + s;
}

function render() {
  timeDisplay.textContent = fmt(state.remain);
  timeDisplay.classList.toggle('break', state.mode === 'break');
  timeDisplay.classList.toggle('long', state.mode === 'long');
  modeLabel.classList.toggle('break', state.mode === 'break');
  modeLabel.classList.toggle('long', state.mode === 'long');
  progressFill.classList.toggle('break', state.mode === 'break');
  progressFill.classList.toggle('long', state.mode === 'long');

  if (state.mode === 'work') {
    modeLabel.textContent = state.running ? '🍊 集中タイム（がんばれ！）' : '🍊 集中タイム';
  } else if (state.mode === 'long') {
    modeLabel.textContent = state.running ? '🌙 ロング休憩（しっかり休もう）' : '🌙 ロング休憩';
  } else {
    modeLabel.textContent = state.running ? '🍵 休憩タイム（ひとやすみ）' : '🍵 休憩タイム';
  }

  const done = state.totalSec - state.remain;
  progressFill.style.width = Math.min(100, (done / state.totalSec) * 100) + '%';
  startBtn.textContent = state.running ? '一時停止' : (state.remain === state.totalSec ? 'スタート' : 'つづける');
  renderDots();
  renderTree();
  renderStats();
  updateTitle();
}

function renderDots() {
  const total = Math.max(2, data.settings.cyclesPerLong);
  const filled = state.mode === 'long' ? total : (data.cycleCount % total);
  cycleDots.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i < filled ? (state.mode === 'long' ? ' filled long' : ' filled') : '');
    cycleDots.appendChild(d);
  }
}

function updateTitle() {
  if (state.running) {
    const icon = state.mode === 'work' ? '🍊' : (state.mode === 'long' ? '🌙' : '🍵');
    document.title = `${icon} ${fmt(state.remain)} | みかんフォーカス`;
  } else {
    document.title = BASE_TITLE;
  }
}

function renderStats() {
  const today = data.stats.days[dayKey()] || { sessions: 0, minutes: 0 };
  document.getElementById('statToday').textContent = today.sessions;
  document.getElementById('statTotal').textContent = data.stats.sessionsTotal;
  document.getElementById('statMinutes').textContent = data.stats.minutesTotal;
}

// ===== サウンド（Web Audio） =====
let audioCtx = null;
function chime() {
  if (!data.settings.soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = state.mode === 'work' ? [523.25, 659.25, 783.99] : [783.99, 659.25, 523.25];
    notes.forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime + i * 0.18);
      gain.gain.exponentialRampToValueAtTime(0.22, audioCtx.currentTime + i * 0.18 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + i * 0.18 + 0.9);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + i * 0.18);
      osc.stop(audioCtx.currentTime + i * 0.18 + 1.0);
    });
  } catch {}
}

// ===== タイマーロジック =====
function tick() {
  const now = Date.now();
  const elapsed = Math.floor((now - state.lastTick) / 1000);
  if (elapsed <= 0) return;
  state.lastTick = now;
  state.remain -= elapsed;
  if (state.remain <= 0) {
    state.remain = 0;
    render();
    complete();
    return;
  }
  render();
}

function complete() {
  stopTimer();
  chime();
  if (state.mode === 'work') {
    const mins = Math.round(state.totalSec / 60);
    data.stats.sessionsTotal += 1;
    data.stats.minutesTotal += mins;
    const key = dayKey();
    const day = data.stats.days[key] || (data.stats.days[key] = { sessions: 0, minutes: 0 });
    day.sessions += 1;
    day.minutes += mins;
    data.growth = Math.min(100, data.growth + 100 / 8);
    data.cycleCount += 1;
    // アクティブなタスクにみかんを加算
    const task = data.tasks.find(t => t.id === data.activeTaskId);
    if (task) task.pomos = (task.pomos || 0) + 1;
    const isLong = data.cycleCount % Math.max(2, data.settings.cyclesPerLong) === 0;
    setMode(isLong ? 'long' : 'break');
    saveData();
    notify('🍊 みかんが実りました！', isLong ? 'ロング休憩の時間です。' : '休憩タイムです。');
  } else {
    setMode('work');
    notify('🍵 休憩おわり', '次の集中タイムへ！');
  }
  render();
  if (data.settings.autoStartNext) {
    setTimeout(() => { if (!state.running) startTimer(); }, 1200);
  }
}

function notify(title, body) {
  if (!data.settings.notifyOn) return;
  if (!('Notification' in window)) return;
  if (Notification.permission === 'granted') {
    try { new Notification(title, { body }); } catch {}
  }
}

function startTimer() {
  if (state.running) return;
  state.running = true;
  state.lastTick = Date.now();
  state.timer = setInterval(tick, 250);
  if (data.settings.notifyOn && 'Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
  render();
}

function stopTimer() {
  state.running = false;
  if (state.timer) { clearInterval(state.timer); state.timer = null; }
}

function toggleTimer() {
  if (state.running) { stopTimer(); render(); }
  else startTimer();
}

function resetTimer() {
  stopTimer();
  state.remain = state.totalSec;
  render();
}

function skipPhase() {
  stopTimer();
  // 作業をスキップしても「みかん」は実らない（正直設計）
  if (state.mode === 'work') {
    setMode('break');
  } else {
    setMode('work');
  }
  render();
}

startBtn.addEventListener('click', toggleTimer);
resetBtn.addEventListener('click', resetTimer);
skipBtn.addEventListener('click', skipPhase);

// ===== キーボードショートカット =====
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea, select')) return;
  if (e.code === 'Space') { e.preventDefault(); toggleTimer(); }
  else if (e.key === 'r' || e.key === 'R') { resetTimer(); }
  else if (e.key === 's' || e.key === 'S') { skipPhase(); }
});

// ===== 設定 =====
function bindNumberInput(id, key, min, max, fallback) {
  const el = document.getElementById(id);
  el.value = data.settings[key];
  el.addEventListener('change', () => {
    const v = Math.max(min, Math.min(max, parseInt(el.value) || fallback));
    el.value = v;
    data.settings[key] = v;
    saveData();
    // 実行中でなく、フェーズの先頭にいる場合は表示を更新
    if (!state.running && state.remain === state.totalSec) {
      state.totalSec = phaseSec(state.mode);
      state.remain = state.totalSec;
    }
    render();
  });
}
bindNumberInput('workMin', 'workMin', 1, 120, 25);
bindNumberInput('breakMin', 'breakMin', 1, 60, 5);
bindNumberInput('longBreakMin', 'longBreakMin', 1, 90, 15);
bindNumberInput('cyclesPerLong', 'cyclesPerLong', 2, 8, 4);

function bindToggle(id, key) {
  const el = document.getElementById(id);
  el.checked = !!data.settings[key];
  el.addEventListener('change', () => {
    data.settings[key] = el.checked;
    saveData();
  });
}
bindToggle('soundOn', 'soundOn');
bindToggle('notifyOn', 'notifyOn');
bindToggle('autoStartNext', 'autoStartNext');

// ===== みかんの木（ピクセルアート風canvas描画） =====
const treeCanvas = document.getElementById('treeCanvas');
const tctx = treeCanvas.getContext('2d');
const W = treeCanvas.width, H = treeCanvas.height;

function treeStage() {
  const g = data.growth;
  if (g <= 0) return 0;
  if (g < 25) return 1;
  if (g < 50) return 2;
  if (g < 75) return 3;
  if (g < 100) return 4;
  return 5;
}

function px(x, y, s, color) {
  tctx.fillStyle = color;
  tctx.fillRect(x * s, y * s, s, s);
}

function drawTree() {
  tctx.clearRect(0, 0, W, H);
  const stage = treeStage();
  const S = 4;
  const groundY = H - 24;
  tctx.fillStyle = '#e8d9a8';
  tctx.fillRect(0, groundY, W, 24);
  tctx.fillStyle = '#d9c88a';
  for (let x = 0; x < W; x += 8) tctx.fillRect(x, groundY + 4, 4, 2);

  const cx = Math.floor(W / 2 / S);
  const baseY = Math.floor((groundY - 6) / S);

  if (stage === 0) {
    px(cx - 1, baseY, S, '#8a5a2a');
    px(cx, baseY, S, '#a06a34');
    px(cx - 1, baseY + 1, S, '#6b4520');
    px(cx, baseY + 1, S, '#8a5a2a');
    return;
  }

  if (stage === 1) {
    px(cx, baseY - 1, S, '#6a9e3f');
    px(cx, baseY - 2, S, '#7ab84a');
    px(cx - 1, baseY - 1, S, '#5a8e33');
    px(cx, baseY, S, '#8a5a2a');
    return;
  }

  const trunkH = stage === 2 ? 4 : 6;
  for (let i = 0; i < trunkH; i++) {
    px(cx - 1, baseY - i, S, '#8a5a2a');
    px(cx, baseY - i, S, '#9a6a34');
  }

  if (stage === 2) {
    const ty = baseY - trunkH;
    const leaves = [[-2,-1],[0,-1],[2,-1],[-3,0],[-1,0],[1,0],[3,0],[-2,1],[0,1],[2,1]];
    for (const [dx, dy] of leaves) {
      const shade = ((dx + dy) % 2 === 0) ? '#6a9e3f' : '#7ab84a';
      px(cx + dx, ty + dy, S, shade);
    }
    return;
  }

  const ty = baseY - trunkH;
  const crown = [];
  for (let dy = -3; dy <= 2; dy++) {
    for (let dx = -4; dx <= 4; dx++) {
      const d = Math.abs(dx) + Math.abs(dy) * 1.4;
      if (d < 4.6) crown.push([dx, dy]);
    }
  }
  for (const [dx, dy] of crown) {
    const shade = ((dx * 3 + dy * 5) % 3 === 0) ? '#5a8e33' : (((dx + dy) % 2 === 0) ? '#6a9e3f' : '#7ab84a');
    px(cx + dx, ty + dy, S, shade);
  }

  if (stage === 3) {
    const flowers = [[-3,-1],[1,-2],[3,0],[-1,1],[0,-1]];
    for (const [dx, dy] of flowers) {
      px(cx + dx, ty + dy, S, '#fffbe8');
      px(cx + dx, ty + dy - 1, S, '#fff4d0');
    }
  }

  if (stage >= 4) {
    const fruits = [[-3,0],[2,-1],[-1,1],[3,1],[0,-2],[-2,-2]];
    const n = stage === 5 ? fruits.length : 3;
    for (let i = 0; i < n; i++) {
      const [dx, dy] = fruits[i];
      px(cx + dx, ty + dy, S, '#f5a623');
      px(cx + dx, ty + dy - 1, S, '#f7b93f');
      px(cx + dx + 1, ty + dy, S, '#e8890c');
    }
  }
}

function updateStageLabel() {
  const stage = treeStage();
  const labels = [
    'まだ種をまいたばかり…',
    '🌱 芽が出ました！',
    '🌿 若木が育っています',
    '🌸 花が咲きました！',
    '🍊 実がなりはじめました',
    '🎉 みかんが鈴なりです！',
  ];
  document.getElementById('treeStage').textContent = labels[stage];
}

function renderTree() {
  drawTree();
  updateStageLabel();
}

// ===== 初期化 =====
setMode('work');
render();
</script>
